<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>iPray Global – LIVE Prayer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f2f5f7;
    font-family: Arial, sans-serif;
}
.navbar {
    background: #1a237e;
}

/* Live ticker */
.ticker {
    background: red;
    color: white;
    padding: 8px;
    font-weight: bold;
    animation: pulse 1s infinite;
    text-align: center;
}
@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: .4; }
  100% { opacity: 1; }
}

/* Chat box */
.chat-box {
    height: 400px;
    background: white;
    border-radius: 8px;
    padding: 10px;
    overflow-y: auto;
}

/* Video */
.video-frame {
    width: 100%;
    height: 450px;
    border: none;
    border-radius: 8px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <img src="logo.png" height="70">
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
        <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
        <li class="nav-item"><a href="live.html" class="nav-link active">LIVE</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- LIVE TICKER -->
<div class="ticker">🔴 LIVE NOW — GLOBAL PRAYER ROOM OPEN</div>

<!-- MAIN STREAM SECTION -->
<div class="container mt-4">

    <div class="row">
        <!-- LIVE VIDEO -->
        <div class="col-lg-8 mb-3">
            <h3><strong>Live Stream</strong></h3>

            <!-- ✅ Replace YOUTUBE LINK with your live source -->
            <iframe class="video-frame"
                src="https://www.youtube.com/embed/LIVE_STREAM_LINK_HERE"
                allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>

            <div class="mt-3">
                <a href="#" class="btn btn-success btn-lg">Join Prayer</a>
            </div>
        </div>

        <!-- LIVE CHAT -->
        <div class="col-lg-4">
            <h4><strong>Live Chat</strong></h4>
            <div class="chat-box" id="chatBox">
                <!-- Messages will appear here -->
            </div>

            <div class="input-group mt-2">
                <input type="text" id="chatInput" class="form-control" placeholder="Type a message...">
                <button class="btn btn-primary" onclick="sendChat()">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
// SIMPLE DUMMY CHAT (works even without backend)
function sendChat() {
    var input = document.getElementById("chatInput");
    if(input.value.trim() === '') return;

    var chatBox = document.getElementById("chatBox");
    var message = document.createElement("div");
    message.innerHTML = "<strong>You:</strong> " + input.value;
    chatBox.appendChild(message);
    chatBox.scrollTop = chatBox.scrollHeight;

    input.value = "";
}
</script>

<footer class="mt-5 p-3 text-center text-white" style="background:#111">
    © 2025 iPray Global
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
